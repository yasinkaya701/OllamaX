name: Deploy Krevyx website to GitHub Pages

on:
  # Runs on pushes to main that touch the website, and on demand
  push:
    branches: [main]
    paths:
      - "krevyx-site/**"
      - ".github/workflows/gh-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skip stale runs, and cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The site is pre-built locally (krevyx-site/dist/public) and committed.
      # This guarantees the deployed bundle matches the tested build — builds
      # inside Actions produced a different asset hash and stale pages output.
      - name: Verify pre-built site output
        working-directory: krevyx-site
        run: |
          if [ ! -f dist/public/index.html ] || [ ! -f dist/public/404.html ]; then
            echo "ERROR: krevyx-site/dist/public is missing the pre-built site. Rebuild locally and commit before pushing."
            exit 1
          fi
          ls dist/public/assets/
          grep -E 'canonical' dist/public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: krevyx-site/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
