name: RC Package Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            builder_target: linux
            artifact_path: dist/*.AppImage
          - platform: windows
            os: windows-latest
            builder_target: win
            artifact_path: dist/*.exe
          - platform: macos-arm64
            os: macos-latest
            builder_target: mac
            artifact_path: |
              dist/*.dmg
              dist/*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Native prerequisites (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package without publishing
        run: pnpm exec electron-builder --${{ matrix.builder_target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: krevyx-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
