name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsecret-1-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Diagnose worker teardown by suite
        run: |
          echo '=== roadmap-modules ==='
          pnpm exec jest tests/roadmap-modules.test.js --ci --maxWorkers=1
          echo '=== secrets-vault ==='
          pnpm exec jest tests/secrets-vault.test.js --ci --maxWorkers=1
          echo '=== plans ==='
          pnpm exec jest tests/test-v325-plans.test.js --ci --maxWorkers=1
          echo '=== bridge/hooks ==='
          pnpm exec jest tests/v321.test.js tests/bridge-stress.test.js tests/v4-wave0.test.js --ci --maxWorkers=1
