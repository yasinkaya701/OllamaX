name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsecret-1-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Diagnose worker teardown B2 split
        run: |
          echo '=== B2A ==='
          pnpm exec jest \
            tests/featured-discover.test.js tests/cli-verify-audit.test.js \
            tests/network-mode.test.js tests/secrets-vault.test.js --ci
          echo '=== B2B ==='
          pnpm exec jest \
            tests/delegate-parse.test.js tests/v4-wave0.test.js tests/manus-agent.test.js --ci
