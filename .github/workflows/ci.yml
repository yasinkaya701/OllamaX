name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsecret-1-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Diagnose remaining teardown handles
        run: |
          echo '=== delegate-parse ==='
          pnpm exec jest tests/delegate-parse.test.js --ci --runInBand --detectOpenHandles --forceExit
          echo '=== v4-wave0 ==='
          pnpm exec jest tests/v4-wave0.test.js --ci --runInBand --detectOpenHandles --forceExit
          echo '=== manus-agent ==='
          pnpm exec jest tests/manus-agent.test.js --ci --runInBand --detectOpenHandles --forceExit
