name: Release Build (Mac / Windows / Linux)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build: build:linux
            artifact: "dist/*.AppImage"
            platform: linux
          - os: windows-latest
            build: build:win
            artifact: "dist/*.exe"
            platform: win
          - os: macos-latest
            build: build:mac
            artifact: "dist/*.dmg"
            platform: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Verify pnpm
        run: pnpm --version

      - name: Approve native module build scripts (pnpm v11)
        run: printf 'y\n' | pnpm approve-builds --all
        env:
          CI: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pty native module deps (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsecret-1-dev

      - name: Install keytar native deps (macOS)
        if: matrix.platform == 'mac'
        run: brew install libsecret 2>/dev/null || true

      - name: Build package
        run: npm run ${{ matrix.build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && 'true' || 'false' }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
